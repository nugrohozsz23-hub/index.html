<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary, Sayang!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffe6e9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 100%;
        }
        .img-container {
            width: 100%;
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .heart {
            font-size: 35px;
            color: #ff4d6d;
            animation: pulse 1.2s infinite;
            margin-bottom: 10px;
        }
        h1 {
            color: #c9184a;
            font-size: 22px;
            margin-bottom: 12px;
        }
        p {
            color: #555;
            line-height: 1.6;
            font-size: 14px;
            margin-bottom: 20px;
        }
        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
        }
        button:hover {
            background-color: #c9184a;
            transform: translateY(-2px);
        }
        #message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #fff0f3;
            border-left: 4px solid #ff4d6d;
            border-radius: 8px;
            color: #800f2f;
            font-style: italic;
            font-size: 14px;
        }
        audio {
            display: none;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Foto Romantis -->
        <div class="img-container">
            <img src="foto.jpg" alt="Foto Kita">
        </div>

        <div class="heart">❤️</div>
        <h1>Happy Anniversary, Sayang!</h1>
        <p>Makasih ya udah menemani perjalanan sejauh ini. Nggak sabar buat melangkah ke jenjang berikutnya dan menghabiskan sisa hidupku bareng kamu.</p>
        
        <button onclick="playMusicAndShowMessage()">Klik Untuk Membuka 🎵</button>
        
        <div id="message">
            "Kamu adalah alasan aku selalu bersemangat menyambut esok hari. Tetap sama-sama terus ya, calon istriku! 💍✨"
        </div>

        <!-- Audio Player (Tersembunyi) -->
        <audio id="bgMusic" src="lagu.mp3" loop></audio>
    </div>

    <script>
        function playMusicAndShowMessage() {
            var msg = document.getElementById("message");
            var music = document.getElementById("bgMusic");

            if (msg.style.display === "block") {
                msg.style.display = "none";
                music.pause();
            } else {
                msg.style.display = "block";
                music.play().catch(function(error) {
                    console.log("Autoplay dicegah oleh browser: " + error);
                });
            }
        }
    </script>

</body>
</html>
